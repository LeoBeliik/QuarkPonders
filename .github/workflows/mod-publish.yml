name: Pubish mod

on: workflow_dispatch

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: '21'
                
    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew
      
    - name: Build with Gradle
      run: ./gradlew --max-workers 1 build -x :compileJava
      
    - name: Collect version information
      run: |
          set_var() {
            echo $1="$2"
            echo $1="$2" >> $GITHUB_ENV
            declare -g $1="$2"
          }
          set_var JAR_FILE $(eval echo build/libs/QuarkPonders-*_NeoForge-*.jar)
          set_var MOD_VERSION $(echo "$JAR_FILE" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)

    - name: Publish Minecraft Mods NeoForge Edition
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        files: build/libs/!(*-@(dev|sources|javadoc)).jar

        modrinth-id: JY7his81
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        curseforge-id: 1290960
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

        name: Quark Ponders ${{env.MOD_VERSION}} - NeoForge ${{github.ref_name}}
        loaders: neoforge
        game-versions: ${{github.ref_name}}
        version: ${{env.MOD_VERSION}}-${{github.ref_name}}
        java: Java 21
        modrinth-featured: true
        modrinth-unfeature-mode: subset
        changelog-file: CHANGELOG.md
        dependencies: |
          Quark(required){modrinth:qnQsVE2z}{curseforge:243121}
          
    - name: Cleanup Gradle Cache
      run: ./gradlew --stop |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
